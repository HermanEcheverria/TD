<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense - Battle Royale Roguelite</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0c10;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI GLASSMORPHISM HUD OVERLAY */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* TOP STATS BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      pointer-events: auto;
    }

    .stat-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-badge span.icon {
      font-size: 18px;
    }

    /* LEVEL & XP PROGRESS */
    .xp-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 220px;
    }

    .xp-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }

    .xp-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .xp-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 5px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }

    /* HP BAR TOP */
    .hp-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 200px;
    }

    .hp-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #f87171;
    }

    .hp-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #22c55e);
      border-radius: 5px;
      transition: width 0.2s ease, background 0.3s ease;
    }

    /* ROGUELITE PERK MODAL */
    #upgrade-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 15, 0.85);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      pointer-events: auto;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      text-align: center;
    }

    .modal-title h2 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #facc15, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .modal-title p {
      color: #94a3b8;
      font-size: 16px;
      margin-top: 6px;
    }

    .perks-grid {
      display: flex;
      gap: 24px;
      max-width: 900px;
      width: 90%;
      justify-content: center;
    }

    .perk-card {
      flex: 1;
      max-width: 260px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .perk-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: #38bdf8;
      box-shadow: 0 20px 35px -5px rgba(56, 189, 248, 0.3);
    }

    .perk-icon {
      font-size: 48px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.05);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .perk-name {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .perk-desc {
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
      line-height: 1.4;
    }

    /* GAME OVER / VICTORY MODAL */
    #gameover-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 20, 0.9);
      backdrop-filter: blur(20px);
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      pointer-events: auto;
    }

    .go-card {
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(239, 68, 68, 0.5);
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.3);
    }

    .go-card.victory {
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 0 50px rgba(34, 197, 94, 0.3);
    }

    .go-title {
      font-size: 42px;
      font-weight: 800;
      color: #ef4444;
      margin-bottom: 10px;
    }

    .go-card.victory .go-title {
      color: #22c55e;
    }

    .go-sub {
      color: #94a3b8;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn-respawn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    .btn-respawn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
    }

    /* LEADERBOARD & MINIMAP BOTTOM CORNER */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      pointer-events: auto;
    }

    .leaderboard {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 16px;
      min-width: 200px;
    }

    .lb-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .lb-item .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <!-- Phaser Canvas Parent Container -->
  <div id="game-container"></div>

  <!-- HUD Overlay -->
  <div id="hud-overlay">
    
    <!-- Top Stats Navigation Bar -->
    <div class="top-bar">
      <!-- Player HP Bar -->
      <div class="hp-container">
        <div class="hp-header">
          <span>SALUD DE TORRE</span>
          <span id="hp-text">200 / 200</span>
        </div>
        <div class="hp-bar-bg">
          <div id="hp-fill" class="hp-bar-fill"></div>
        </div>
      </div>

      <!-- XP & Level -->
      <div class="xp-container">
        <div class="xp-header">
          <span id="level-badge">NIVEL 1</span>
          <span id="xp-text">0 / 100 XP</span>
        </div>
        <div class="xp-bar-bg">
          <div id="xp-fill" class="xp-bar-fill"></div>
        </div>
      </div>

      <!-- Badges: Wave, Coins, Kills -->
      <div class="stat-group">
        <div class="stat-badge" style="color: #facc15;">
          <span class="icon">🪙</span>
          <span id="coins-text">0</span>
        </div>
        <div class="stat-badge" style="color: #ef4444;">
          <span class="icon">💀</span>
          <span id="kills-text">0</span>
        </div>
        <div class="stat-badge" style="color: #a855f7;">
          <span class="icon">🌊</span>
          <span>OLEADA <span id="wave-text">1</span> (<span id="wave-timer-text">20</span>s)</span>
        </div>
      </div>
    </div>

    <!-- Bottom Bar: Leaderboard / Alive players -->
    <div class="bottom-bar">
      <div class="leaderboard">
        <div class="lb-title">Jugadores Activos</div>
        <div id="lb-list">
          <!-- Dynamic JS Populated -->
        </div>
      </div>
    </div>

  </div>

  <!-- Roguelite Perk Modal -->
  <div id="upgrade-modal">
    <div class="modal-title">
      <h2>¡SUBIDA DE NIVEL!</h2>
      <p>Selecciona 1 mejora tecnológica para evolucionar tu Torre</p>
    </div>
    <div id="perks-container" class="perks-grid">
      <!-- Dynamic cards rendered here -->
    </div>
  </div>

  <!-- Game Over / Victory Modal -->
  <div id="gameover-modal">
    <div id="go-card" class="go-card">
      <div id="go-title" class="go-title">¡TORRE DESTRUIDA!</div>
      <div id="go-sub" class="go-sub">Has sucumbido ante el enemigo.</div>
      <button class="btn-respawn" onclick="respawnGame()">VOLVER A REPARAR TORRE</button>
    </div>
  </div>

  <!-- Client Phaser Game Logic -->
  <script src="game.js"></script>

</body>
</html>
